<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Generator - Approval Queue</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
      }

      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }

      .header p {
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary {
        background: white;
        color: #667eea;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: 2px solid white;
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .status {
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.3);
        padding: 15px;
        border-radius: 8px;
        color: white;
        text-align: center;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
      }

      .status.generating {
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }

      .card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
      }

      .card-preview {
        width: 100%;
        height: 300px;
        background: #f5f5f5;
        border-bottom: 1px solid #ddd;
        overflow: hidden;
        position: relative;
      }

      .card-preview iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .card-preview.loading {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        color: #999;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin-right: 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .card-body {
        padding: 20px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }

      .card-title {
        font-size: 0.9rem;
        color: #999;
        margin-bottom: 10px;
      }

      .card-actions {
        display: flex;
        gap: 10px;
        margin-top: auto;
      }

      .card-actions button {
        flex: 1;
        padding: 10px;
        border: 2px solid;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .btn-approve {
        background: #4caf50;
        color: white;
        border-color: #4caf50;
      }

      .btn-approve:hover {
        background: #45a049;
        transform: scale(1.05);
      }

      .btn-reject {
        background: #f44336;
        color: white;
        border-color: #f44336;
      }

      .btn-reject:hover {
        background: #da190b;
        transform: scale(1.05);
      }

      .btn-view {
        background: transparent;
        color: #667eea;
        border-color: #667eea;
      }

      .btn-view:hover {
        background: #667eea;
        color: white;
      }

      .empty {
        background: white;
        padding: 40px;
        border-radius: 12px;
        text-align: center;
        color: #999;
      }

      .empty h3 {
        font-size: 1.3rem;
        margin-bottom: 10px;
        color: #666;
      }

      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        background: rgba(255, 255, 255, 0.1);
        padding: 10px;
        border-radius: 8px;
        backdrop-filter: blur(10px);
      }

      .tab {
        flex: 1;
        padding: 10px;
        border: 2px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: white;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .tab.active {
        background: white;
        color: #667eea;
        border-color: white;
      }

      .tab:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px);
      }

      .modal.active {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-content {
        background: white;
        padding: 0;
        border-radius: 12px;
        width: 90%;
        max-width: 1000px;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
      }

      .modal-header {
        padding: 20px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-body {
        flex: 1;
        overflow: auto;
        padding: 20px;
      }

      .modal-body iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: #999;
      }

      .close-btn:hover {
        color: #333;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const {
        useState,
        useEffect,
        useCallback,
        useRef,
      } = React;

      const API_BASE = "/api/generator";

      function WebsiteGenerator() {
        const [websites, setWebsites] = useState([]);
        const [activeTab, setActiveTab] = useState("pending");
        const [isGenerating, setIsGenerating] = useState(false);
        const [loopRunning, setLoopRunning] = useState(false);
        const [selectedWebsite, setSelectedWebsite] = useState(null);
        const [loading, setLoading] = useState(false);
        const refreshIntervalRef = useRef(null);

        const fetchWebsites = useCallback(async () => {
          try {
            const response = await fetch(`${API_BASE}/pending`);
            const data = await response.json();
            setWebsites(data.websites || []);
          } catch (error) {
            console.error("Error fetching websites:", error);
          }
        }, []);

        useEffect(() => {
          fetchWebsites();

          // Poll for new websites every 5 seconds
          refreshIntervalRef.current = setInterval(() => {
            fetchWebsites();
          }, 5000);

          return () => {
            if (refreshIntervalRef.current) {
              clearInterval(refreshIntervalRef.current);
            }
          };
        }, [fetchWebsites]);

        const generateNow = async () => {
          setIsGenerating(true);
          try {
            const response = await fetch(`${API_BASE}/generate`, {
              method: "POST",
            });
            const data = await response.json();
            if (data.success) {
              await fetchWebsites();
            }
          } catch (error) {
            console.error("Error generating website:", error);
            alert("Failed to generate website: " + error.message);
          } finally {
            setIsGenerating(false);
          }
        };

        const toggleLoop = () => {
          setLoopRunning(!loopRunning);
          // In a real app, you'd call an API endpoint to control the loop
        };

        const approveWebsite = async (id) => {
          try {
            const response = await fetch(`${API_BASE}/approve/${id}`, {
              method: "POST",
            });
            const data = await response.json();
            if (data.success) {
              await fetchWebsites();
              setSelectedWebsite(null);
              alert("✓ Website approved and committed to GitHub!");
            }
          } catch (error) {
            console.error("Error approving website:", error);
            alert("Failed to approve: " + error.message);
          }
        };

        const rejectWebsite = async (id) => {
          try {
            const response = await fetch(`${API_BASE}/reject/${id}`, {
              method: "POST",
            });
            const data = await response.json();
            if (data.success) {
              await fetchWebsites();
              setSelectedWebsite(null);
            }
          } catch (error) {
            console.error("Error rejecting website:", error);
          }
        };

        const viewWebsite = (id) => {
          setSelectedWebsite(id);
        };

        return (
          <div className="container">
            <div className="header">
              <h1>🎨 Website Generator</h1>
              <p>Generate, review, and approve AI-designed websites</p>
            </div>

            <div className="controls">
              <button
                className="btn btn-primary"
                onClick={generateNow}
                disabled={isGenerating}
              >
                {isGenerating ? (
                  <>
                    <span className="spinner"></span>
                    Generating...
                  </>
                ) : (
                  <>✨ Generate Now</>
                )}
              </button>
              <button
                className={`btn ${loopRunning ? "btn-secondary" : "btn-primary"}`}
                onClick={toggleLoop}
              >
                {loopRunning ? "⏸ Stop Loop" : "▶ Start 5min Loop"}
              </button>
            </div>

            {loopRunning && (
              <div className="status generating">
                🔄 Generation loop running - new website every 5 minutes
              </div>
            )}

            {websites.length === 0 && !isGenerating && (
              <div className="empty">
                <h3>No websites to review yet</h3>
                <p>Generate your first website to get started</p>
              </div>
            )}

            {websites.length > 0 && (
              <div className="tabs">
                <button
                  className={`tab ${activeTab === "pending" ? "active" : ""}`}
                  onClick={() => setActiveTab("pending")}
                >
                  Pending ({websites.length})
                </button>
              </div>
            )}

            <div className="grid">
              {websites.map((website) => (
                <WebsiteCard
                  key={website.id}
                  website={website}
                  onApprove={approveWebsite}
                  onReject={rejectWebsite}
                  onView={viewWebsite}
                />
              ))}
            </div>

            {selectedWebsite && (
              <WebsiteModal
                websiteId={selectedWebsite}
                onClose={() => setSelectedWebsite(null)}
                onApprove={approveWebsite}
                onReject={rejectWebsite}
              />
            )}
          </div>
        );
      }

      function WebsiteCard({ website, onApprove, onReject, onView }) {
        const [loaded, setLoaded] = useState(false);

        return (
          <div className="card">
            <div
              className={`card-preview ${!loaded ? "loading" : ""}`}
            >
              {!loaded && (
                <>
                  <span className="spinner"></span>
                  <span>Loading preview...</span>
                </>
              )}
              <iframe
                key={website.id}
                srcDoc={`<iframe src="/api/generator/pending/${website.id}" style="width:100%;height:100%;border:none;"></iframe>`}
                onLoad={() => setLoaded(true)}
                title={`Website ${website.id}`}
              />
            </div>
            <div className="card-body">
              <div className="card-title">ID: {website.id}</div>
              <div className="card-actions">
                <button className="btn-view" onClick={() => onView(website.id)}>
                  View Full
                </button>
                <button
                  className="btn-approve"
                  onClick={() => onApprove(website.id)}
                >
                  ✓ Approve
                </button>
                <button
                  className="btn-reject"
                  onClick={() => onReject(website.id)}
                >
                  ✕ Reject
                </button>
              </div>
            </div>
          </div>
        );
      }

      function WebsiteModal({ websiteId, onClose, onApprove, onReject }) {
        return (
          <div className="modal active">
            <div className="modal-content">
              <div className="modal-header">
                <h2>Website #{websiteId}</h2>
                <button className="close-btn" onClick={onClose}>
                  ✕
                </button>
              </div>
              <div className="modal-body">
                <iframe
                  src={`/api/generator/pending/${websiteId}`}
                  title={`Website ${websiteId} Full View`}
                  style={{ width: "100%", height: "100%", border: "none" }}
                />
              </div>
              <div
                className="card-actions"
                style={{ padding: "20px", borderTop: "1px solid #eee" }}
              >
                <button
                  className="btn-approve"
                  onClick={() => onApprove(websiteId)}
                >
                  ✓ Approve
                </button>
                <button
                  className="btn-reject"
                  onClick={() => onReject(websiteId)}
                >
                  ✕ Reject
                </button>
                <button
                  className="btn-view"
                  onClick={onClose}
                >
                  Close
                </button>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        <WebsiteGenerator />
      );
    </script>
  </body>
</html>
